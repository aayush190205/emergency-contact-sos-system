version: '3.8'

services:
  # 1. MongoDB Database
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - sos-network

  # 2. Backend API
  backend:
    build: ./server
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - sos-network
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/sos_db
      - CHOKIDAR_USEPOLLING=true

  # 3. Frontend React App
  frontend:
    build: ./client
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - sos-network
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  mongo-data:

networks:
  sos-network:
    driver: bridge